<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas & MediaRecorder 動画エディター</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
            --text-sub: #4B5563;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 上部：コントロールエリア */
        .top-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            align-items: center;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-full {
            width: 100%;
            margin-top: 12px;
        }

        .btn-load {
            background-color: var(--surface);
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-load:hover:not(:disabled) { background-color: #EEF2FF; }
        .btn-load:disabled {
            color: #9CA3AF;
            border-color: #D1D5DB;
            cursor: not-allowed;
            background-color: #F9FAFB;
        }

        .btn-export {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        .btn-export:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-export:disabled {
            background-color: #9CA3AF;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* メインコンテンツエリア */
        .main-content {
            display: flex;
            gap: 24px;
            flex: 1;
            min-height: 0;
        }

        /* 左側：プレビュー画面 */
        .left-panel {
            flex: 2;
            background-color: #000;
            border-radius: 12px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* 画面上に表示するCanvas */
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 進捗表示オーバーレイ */
        .progress-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }

        .progress-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .progress-bar-bg {
            width: 60%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #10B981;
            transition: width 0.1s linear;
        }

        /* 右側：設定パネル */
        .right-panel {
            flex: 1;
            background-color: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .settings-group {
            margin-bottom: 30px;
        }

        .settings-group h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 16px;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .input-row label {
            font-size: 14px;
            color: var(--text-sub);
            flex: 1;
        }

        input[type="number"] {
            width: 80px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            text-align: right;
        }
        input[type="number"]:focus { border-color: var(--primary); }

        .unit {
            font-size: 12px;
            color: var(--text-sub);
            margin-left: 8px;
            width: 20px;
        }
    </style>
</head>
<body>

    <!-- 上部：ボタンエリア -->
    <div class="top-controls">
        <button id="loadBtn" class="btn btn-load">動画を読み込む</button>
        <input type="file" id="uploadInput" accept="video/*" style="display: none;">
        <button id="processBtn" class="btn btn-export" disabled>書き出し開始</button>
    </div>

    <!-- メインエリア -->
    <div class="main-content">
        
        <!-- 左側：プレビューキャンバス -->
        <div class="left-panel">
            <canvas id="previewCanvas"></canvas>
            <!-- 元動画処理用の非表示video要素 -->
            <video id="sourceVideo" style="display: none;" playsinline muted></video>

            <!-- 進捗表示オーバーレイ -->
            <div id="progressOverlay" class="progress-overlay">
                <div id="progressText" class="progress-text">録画中... 0%</div>
                <div class="progress-bar-bg">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- 右側：設定 -->
        <div class="right-panel">
            
            <div class="settings-group">
                <h3>時間をトリミング</h3>
                <div class="input-row">
                    <label>開始時間</label>
                    <input type="number" id="startTime" value="0" min="0" step="0.1">
                    <span class="unit">秒</span>
                </div>
                <div class="input-row">
                    <label>終了時間</label>
                    <input type="number" id="endTime" value="10" min="0.1" step="0.1">
                    <span class="unit">秒</span>
                </div>
                <!-- 追加：プレビューボタン -->
                <button id="previewFrameBtn" class="btn btn-load btn-full" disabled>開始フレームをプレビュー</button>
            </div>

            <div class="settings-group">
                <h3>画面をクロップ（削る）</h3>
                <div class="input-row">
                    <label>上端から</label>
                    <input type="number" id="cropTop" class="crop-input" value="0" min="0">
                    <span class="unit">px</span>
                </div>
                <div class="input-row">
                    <label>下端から</label>
                    <input type="number" id="cropBottom" class="crop-input" value="0" min="0">
                    <span class="unit">px</span>
                </div>
                <div class="input-row">
                    <label>左端から</label>
                    <input type="number" id="cropLeft" class="crop-input" value="0" min="0">
                    <span class="unit">px</span>
                </div>
                <div class="input-row">
                    <label>右端から</label>
                    <input type="number" id="cropRight" class="crop-input" value="0" min="0">
                    <span class="unit">px</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // DOM要素の取得
        const uploadInput = document.getElementById('uploadInput');
        const loadBtn = document.getElementById('loadBtn');
        const processBtn = document.getElementById('processBtn');
        const previewFrameBtn = document.getElementById('previewFrameBtn');
        
        const sourceVideo = document.getElementById('sourceVideo');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        
        const progressOverlay = document.getElementById('progressOverlay');
        const progressText = document.getElementById('progressText');
        const progressBarFill = document.getElementById('progressBarFill');

        let isExporting = false;
        let renderAnimationId = null;

        // 動画読み込み処理
        loadBtn.addEventListener('click', () => uploadInput.click());

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                sourceVideo.src = URL.createObjectURL(file);
                sourceVideo.load();
            }
        });

        // 動画データのメタデータ読み込み完了時
        sourceVideo.addEventListener('loadedmetadata', () => {
            document.getElementById('endTime').value = sourceVideo.duration.toFixed(1);
            processBtn.disabled = false;
            previewFrameBtn.disabled = false; // プレビューボタンを有効化
            updateCanvasDimensions();
            drawFrame();
        });

        // ==========================================
        // 追加機能：開始フレームをプレビュー
        // ==========================================
        previewFrameBtn.addEventListener('click', () => {
            if (isExporting || sourceVideo.readyState < 2) return;
            
            const startTime = parseFloat(document.getElementById('startTime').value) || 0;
            
            // シーク（時間移動）完了時に確実に再描画する
            sourceVideo.addEventListener('seeked', function onSeeked() {
                updateCanvasDimensions();
                drawFrame();
                sourceVideo.removeEventListener('seeked', onSeeked);
            });
            
            // 動画の再生位置を開始時間に移動させる
            sourceVideo.currentTime = startTime;
        });

        // クロップ値変更時にリアルタイムでCanvasサイズと描画を更新
        document.querySelectorAll('.crop-input').forEach(input => {
            input.addEventListener('input', () => {
                if (!isExporting && sourceVideo.readyState >= 2) {
                    updateCanvasDimensions();
                    drawFrame();
                }
            });
        });

        // Canvasのサイズをクロップ設定に合わせて更新
        function updateCanvasDimensions() {
            const top = parseInt(document.getElementById('cropTop').value) || 0;
            const bottom = parseInt(document.getElementById('cropBottom').value) || 0;
            const left = parseInt(document.getElementById('cropLeft').value) || 0;
            const right = parseInt(document.getElementById('cropRight').value) || 0;

            const targetWidth = Math.max(1, sourceVideo.videoWidth - left - right);
            const targetHeight = Math.max(1, sourceVideo.videoHeight - top - bottom);

            canvas.width = targetWidth;
            canvas.height = targetHeight;
        }

        // Canvasへビデオの指定領域を描画
        function drawFrame() {
            const top = parseInt(document.getElementById('cropTop').value) || 0;
            const left = parseInt(document.getElementById('cropLeft').value) || 0;

            ctx.drawImage(
                sourceVideo,
                left, top, canvas.width, canvas.height, // 切り出し元（位置と幅高）
                0, 0, canvas.width, canvas.height       // 描画先Canvas（位置と幅高）
            );
        }

        // ブラウザがサポートする最も適したH.264/MP4のMIMEタイプを取得
        function getSupportedMimeType() {
            const types = [
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4;codecs=h264',
                'video/mp4',
                'video/webm;codecs=h264',
                'video/webm;codecs=vp9',
                'video/webm'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    return type;
                }
            }
            return '';
        }

        // 書き出し処理
        processBtn.addEventListener('click', async () => {
            const startTime = parseFloat(document.getElementById('startTime').value) || 0;
            const endTime = parseFloat(document.getElementById('endTime').value) || sourceVideo.duration;

            if (startTime >= endTime) {
                alert("開始時間は終了時間より小さく設定してください。");
                return;
            }

            // UIをロック
            isExporting = true;
            processBtn.disabled = true;
            loadBtn.disabled = true;
            previewFrameBtn.disabled = true; // プレビューボタンもロック
            progressOverlay.style.display = 'flex';

            updateCanvasDimensions();

            // Canvasからメディアストリームを取得
            const stream = canvas.captureStream(60);
            
            if (sourceVideo.captureStream) {
                const audioStream = sourceVideo.captureStream();
                const audioTracks = audioStream.getAudioTracks();
                if (audioTracks.length > 0) {
                    stream.addTrack(audioTracks[0]);
                }
            }

            const mimeType = getSupportedMimeType();
            const mediaRecorder = new MediaRecorder(stream, {
                mimeType: mimeType,
                videoBitsPerSecond: 5000000 
            });

            const recordedChunks = [];
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mimeType || 'video/mp4' });
                const url = URL.createObjectURL(blob);
                
                const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                const a = document.createElement('a');
                a.href = url;
                a.download = `edited_video.${ext}`;
                a.click();

                // 状態リセットとUIのロック解除
                isExporting = false;
                processBtn.disabled = false;
                loadBtn.disabled = false;
                previewFrameBtn.disabled = false;
                progressOverlay.style.display = 'none';
            };

            sourceVideo.currentTime = startTime;
            
            sourceVideo.onseeked = async function onSeeked() {
                sourceVideo.onseeked = null;

                mediaRecorder.start();
                await sourceVideo.play();

                function renderLoop() {
                    if (!isExporting) return;

                    drawFrame();

                    const current = sourceVideo.currentTime - startTime;
                    const total = endTime - startTime;
                    let percent = Math.round((current / total) * 100);
                    percent = Math.min(100, Math.max(0, percent));

                    progressText.innerText = `書き出し中... ${percent}%`;
                    progressBarFill.style.width = `${percent}%`;

                    if (sourceVideo.currentTime >= endTime || sourceVideo.ended) {
                        sourceVideo.pause();
                        mediaRecorder.stop();
                    } else {
                        renderAnimationId = requestAnimationFrame(renderLoop);
                    }
                }

                renderLoop();
            };
        });
    </script>
</body>
</html>
