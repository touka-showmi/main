<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="GitHub Pages上のHTMLプログラムを一覧・起動する軽量ランチャー">
  <title>プログラムランチャー</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #182238;
      --text: #edf2ff;
      --muted: #a5b0c8;
      --line: rgba(188, 204, 238, .13);
      --accent: #7c9cff;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(16px, 4vw, 42px);
      background: radial-gradient(ellipse at top left, #192344 0, transparent 45%), var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1200px, 100%); margin: 0 auto; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    h1 { font-size: clamp(1.65rem, 4vw, 2.4rem); line-height: 1.15; margin: 0; letter-spacing: -.03em; }
    .subtitle { color: var(--muted); margin: 10px 0 0; line-height: 1.65; }
    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-pill, .action-button {
      border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px;
      background: rgba(18, 26, 43, .8); color: var(--muted); font-size: .88rem;
    }
    .status-pill { display: inline-flex; gap: 8px; align-items: center; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #42d6a4; }
    .status-dot.offline { background: #ffbb66; }
    .action-button { color: var(--text); cursor: pointer; }
    .action-button:hover { background: var(--panel-2); }
    .toolbar { display: flex; gap: 12px; margin: 28px 0 26px; }
    .search {
      width: 100%; min-width: 0; padding: 13px 16px; border-radius: 13px;
      border: 1px solid var(--line); outline: none; background: rgba(18, 26, 43, .85);
      color: var(--text); font: inherit;
    }
    .search:focus { border-color: rgba(124, 156, 255, .75); box-shadow: 0 0 0 3px rgba(124, 156, 255, .12); }
    section.list-section { margin-top: 34px; }
    #sections > .list-section:first-child { margin-top: 22px; }
    .list-summary { margin: -12px 0 6px; color: var(--muted); font-size: .8rem; text-align: right; }
    .recent-empty { color: var(--muted); font-size: .82rem; line-height: 1.5; padding: 8px 2px 2px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
    h2 { font-size: 1rem; margin: 0; font-weight: 700; color: #dce5ff; }
    .heading-meta { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
    .section-count { font-size: .82rem; color: var(--muted); white-space: nowrap; }
    .scroll-cue { display: none; color: #9ba9c6; font-size: .7rem; white-space: nowrap; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 12px;
    }
    .folder-section + .folder-section { margin-top: 30px; }
    .category-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; color: var(--muted); font-size: .86rem; font-weight: 650; }
    .card {
      --card-accent: #7c9cff;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      align-items: start;
      gap: 12px;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 12px 14px 12px 16px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--card-accent) 18%, #151d30), #121827 72%);
      color: var(--text);
      text-decoration: none;
      isolation: isolate;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--card-accent); }
    .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--card-accent) 68%, white 8%); box-shadow: 0 8px 22px rgba(0,0,0,.16); }
    .card:focus-visible { outline: 3px solid var(--card-accent); outline-offset: 3px; }
    .thumbnail {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: 1px 0 0;
      border-radius: 12px;
      background: color-mix(in srgb, var(--card-accent) 24%, #161d30);
      overflow: hidden;
      color: var(--card-text, #fff);
    }
    .thumbnail .emoji { font-size: 1.65rem; line-height: 1; }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-main { display: flex; flex-direction: column; min-width: 0; }
    .card-title { margin: 0 0 4px; font-size: 1rem; font-weight: 750; line-height: 1.35; overflow-wrap: anywhere; }
    .description {
      color: #bac5dc;
      font-size: .84rem;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
    }
    .path { color: #8290ad; font-size: .69rem; line-height: 1.35; margin-top: 7px; overflow-wrap: anywhere; }
    .tag { display: inline-flex; align-self: flex-start; max-width: 100%; padding: 3px 7px; margin-bottom: 5px; border-radius: 999px; background: rgba(255,255,255,.08); color: #dfe6f8; font-size: .68rem; line-height: 1.35; overflow-wrap: anywhere; }
    .empty, .error { padding: 22px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); line-height: 1.6; }
    .error { border-color: rgba(255, 119, 119, .3); color: #ffabab; }
    footer { border-top: 1px solid var(--line); color: #7e8aa4; margin-top: 44px; padding-top: 18px; font-size: .8rem; line-height: 1.6; }
    [hidden] { display: none !important; }
    .hide-path .path { display: none; }

    @media (max-width: 640px) {
      body { padding: 14px 12px 26px; }
      .topbar { gap: 14px; }
      h1 { font-size: 1.55rem; line-height: 1.2; }
      .subtitle { margin-top: 7px; font-size: .88rem; line-height: 1.55; }
      .actions { width: 100%; gap: 8px; }
      .status-pill, .action-button { padding: 8px 10px; font-size: .78rem; }
      .toolbar { margin: 18px 0 22px; }
      .search { padding: 12px 13px; font-size: 16px; }
      section.list-section { margin-top: 24px; }
      #sections > .list-section:first-child { margin-top: 17px; }
      .list-summary { margin: -8px 0 4px; font-size: .74rem; }
      .section-heading { margin-bottom: 11px; }
      /* スマホでは見出しごとに横スワイプできるアプリタイル型レール */
      .grid {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: clamp(112px, 34vw, 150px);
        grid-template-columns: none;
        gap: 10px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 2px 2px 11px;
        scroll-snap-type: x proximity;
        scroll-padding-inline: 2px;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(165, 176, 200, .35) transparent;
      }
      .grid > .card { scroll-snap-align: start; }
      .folder-section + .folder-section { margin-top: 23px; }
      .category-title { margin-bottom: 9px; font-size: .82rem; }
      .scroll-cue { display: inline; }
      .card {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        min-height: 156px;
        padding: 11px 10px 12px;
        border-radius: 14px;
      }
      .card::before { width: 3px; }
      .card:hover { transform: none; }
      .thumbnail {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        align-self: center;
        margin: 0 0 1px;
        border-radius: 12px;
      }
      .thumbnail .emoji { font-size: 1.35rem; }
      .thumbnail img { border-radius: inherit; }
      .tag { font-size: .62rem; padding: 3px 6px; margin: 0; }
      .folder-section .card .tag { display: none; }
      .card-title {
        font-size: .86rem;
        line-height: 1.35;
        margin: 0;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .description {
        font-size: .72rem;
        line-height: 1.4;
        -webkit-line-clamp: 2;
        line-clamp: 2;
      }
      /* タイルを詰めるため、詳細なパスはPCでのみ表示 */
      .path { display: none; }
      .empty, .error { padding: 16px; }
      footer { margin-top: 30px; font-size: .74rem; }
    }
    @media (max-width: 360px) {
      body { padding-inline: 9px; }
      .grid { grid-auto-columns: 112px; gap: 8px; }
      .card { padding: 10px 9px; gap: 7px; min-height: 150px; }
      .thumbnail { width: 42px; height: 42px; flex-basis: 42px; }
      .thumbnail .emoji { font-size: 1.25rem; }
      .card-title { font-size: .82rem; }
      .description { font-size: .69rem; }
      .scroll-cue { font-size: .65rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <h1 id="pageTitle">プログラムランチャー</h1>
        <p class="subtitle" id="subtitle">HTMLプログラムを選択してください。初回に開いたページは、次回からオフラインでも表示できるよう保存されます。</p>
      </div>
      <div class="actions">
        <div class="status-pill" role="status" aria-live="polite">
          <span id="networkDot" class="status-dot"></span><span id="networkLabel">接続状態を確認中</span>
        </div>
        <button id="installButton" class="action-button" type="button" hidden>アプリをインストール</button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="題名・説明・ファイル名で検索…" aria-label="プログラムを検索">
    </div>

    <div class="list-summary" aria-live="polite"><span id="count">読み込み中…</span></div>
    <div id="sections" aria-live="polite"><div class="empty">プログラム一覧を読み込んでいます…</div></div>

    <footer>
      <span id="footerStatus">見出し順とカードのカスタマイズは program-index.json で設定できます。</span>
      <span> · オフライン利用には、GitHub Pages上で一度オンライン起動する必要があります。</span>
    </footer>
  </main>

  <script>
    "use strict";

    const INDEX_FILE = "./program-index.json";
    const OPENED_KEY = "program-launcher-opened-v2";
    const MAX_RECENT = 20;
    const DEFAULT_SECTION_ORDER = ["recent", "tools", "Archive"];
    const baseURL = new URL("./", location.href);
    const cacheKey = `program-launcher-index-v2:${baseURL.pathname}`;
    let allPrograms = [];
    let installPrompt = null;
    let currentSettings = {};

    const $ = (id) => document.getElementById(id);

    function setNetworkStatus() {
      const online = navigator.onLine;
      $("networkDot").classList.toggle("offline", !online);
      $("networkLabel").textContent = online ? "オンライン" : "オフライン";
    }
    window.addEventListener("online", setNetworkStatus);
    window.addEventListener("offline", setNetworkStatus);
    setNetworkStatus();

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      $("installButton").hidden = false;
    });
    $("installButton").addEventListener("click", async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice.catch(() => null);
      installPrompt = null;
      $("installButton").hidden = true;
    });

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
        .then(() => { $("footerStatus").textContent = "オフライン用の保存機能が有効です。設定は program-index.json で変更できます。"; })
        .catch(() => { $("footerStatus").textContent = "オフライン保存の登録に失敗しました。HTTPSのGitHub Pages上で開いてください。"; });
    } else {
      $("footerStatus").textContent = "オフライン保存にはHTTPSのGitHub Pages上で開く必要があります。";
    }

    function safeFilePath(value) {
      if (typeof value !== "string" || !value.trim()) return false;
      if (value.startsWith("/") || value.includes("\\") || /^[a-z]+:/i.test(value)) return false;
      const parts = value.split("/");
      return parts.every(part => part && part !== "." && part !== "..");
    }

    function safeColor(value, fallback = "#7c9cff") {
      if (typeof value !== "string") return fallback;
      const trimmed = value.trim();
      if (window.CSS && CSS.supports("color", trimmed)) return trimmed;
      return fallback;
    }

    function filenameOf(file) {
      return file.split("/").pop().replace(/\.html?$/i, "");
    }

    // JSON未登録のHTMLに適用する推測ルール。
    // HTML本文を取得せず、パスだけでアイコン・カテゴリ・色・説明を推測するため軽量。
    // 個別のJSON設定がある場合は、mergePrograms() が指定項目のみを上書きする。
    const INFERENCE_RULES = [
      // 音声・音楽（より具体的な語を先に判定）
      { pattern: /reverse|backward|rewind|逆再生|逆再生/, icon: "⏪", category: "音声・音楽", color: "#7c5cff", description: "音声の逆再生・再生操作ツールです。" },
      { pattern: /pro[-_ ]?rack|rack|mixer|mixing|\bmix\b|ミキサー|ミックス|dj[-_ ]?tool|\bdj\b|eq[-_ ]?editor|equalizer|イコライザー/, icon: "🎛️", category: "音声・音楽", color: "#f59e0b", description: "音声を調整・ミックスするためのツールです。" },
      { pattern: /sampler|sample|音源|サンプラー|サンプル音/, icon: "🎹", category: "音声・音楽", color: "#8b5cf6", description: "サンプル音源を扱う音楽ツールです。" },
      { pattern: /reverb|delay[-_ ]?effect|compressor|limiter|audio[-_ ]?effect|sound[-_ ]?effect|fx[-_ ]?rack|エフェクト|残響/, icon: "🎚️", category: "音声・音楽", color: "#d946ef", description: "音声エフェクトを扱うツールです。" },
      { pattern: /player|playlist|プレイヤー|再生|recorder|録音|microphone|mic[-_ ]?test|マイク|録音/, icon: "▶️", category: "音声・音楽", color: "#7c5cff", description: "メディアの再生や録音に関するツールです。" },
      { pattern: /synth|synthesizer|midi|sequencer|メトロノーム|metronome|bpm|tempo|pitch|音程|音階|楽器|instrument|piano|guitar|drum|beat[-_ ]?maker|作曲|作譜/, icon: "🎹", category: "音声・音楽", color: "#a855f7", description: "演奏・作曲・音楽制作を支援するツールです。" },
      { pattern: /audio|sound|music|voice|vocal|waveform|wave[-_ ]?form|spectrum|spectrogram|音声|音楽|サウンド|ボイス|歌声|波形|スペクトラム/, icon: "🎵", category: "音声・音楽", color: "#8b5cf6", description: "音声・音楽を扱うツールです。" },

      // ファイル・共有・保存
      { pattern: /p2p|peer[-_ ]?to[-_ ]?peer|file[-_ ]?(transfer|share|send)|transfer|upload|download|ファイル転送|ファイル共有|送信|アップロード|ダウンロード/, icon: "🔗", category: "ファイル・共有", color: "#1fa6a0", description: "ファイルの送受信・共有に関するツールです。" },
      { pattern: /file[-_ ]?(manager|browser|list)|folder|directory|explorer|storage|drive|ファイル管理|フォルダー|フォルダ|ディレクトリ|ストレージ/, icon: "🗂️", category: "ファイル管理", color: "#0d9488", description: "ファイルやフォルダーを整理するためのツールです。" },
      { pattern: /zip|archive|compress|extract|decompress|圧縮|解凍|アーカイブ/, icon: "🗜️", category: "ファイル管理", color: "#0d9488", description: "ファイルの圧縮・展開に関するツールです。" },
      { pattern: /backup|restore|同期|sync[-_ ]?files|cloud[-_ ]?storage|バックアップ|復元/, icon: "☁️", category: "ファイル管理", color: "#0ea5e9", description: "ファイルの保存・同期・復元を支援するツールです。" },

      // SNS・連絡・情報配信
      { pattern: /sns|social|\bchat\b|messenger|message|comment|forum|community|コミュニティ|交流|チャット|メッセージ|コメント|掲示板/, icon: "💬", category: "SNS・コミュニケーション", color: "#d65c94", description: "メッセージやコミュニケーションに関するツールです。" },
      { pattern: /mail|email|e-mail|inbox|メール|郵便/, icon: "✉️", category: "連絡・メール", color: "#3b82f6", description: "メールや受信箱に関するツールです。" },
      { pattern: /rss|feed[-_ ]?reader|atom|newsletter|news[-_ ]?reader|ニュース|フィード/, icon: "📰", category: "情報・ニュース", color: "#f97316", description: "ニュースや更新情報をまとめて確認するツールです。" },

      // 画像・映像・デザイン
      { pattern: /video[-_ ]?(editor|maker|converter)|movie[-_ ]?(maker|editor)|video|movie|film|動画|映像|映画|ビデオ/, icon: "🎬", category: "動画・映像", color: "#e11d48", description: "動画・映像を扱うツールです。" },
      { pattern: /camera|webcam|photo[-_ ]?(editor|viewer)|image[-_ ]?(editor|viewer|tool|converter)|picture|画像|写真|カメラ|フォト/, icon: "🖼️", category: "画像・写真", color: "#2563eb", description: "画像・写真を表示または加工するツールです。" },
      { pattern: /paint|draw|drawing|sketch|canvas|illustrat|whiteboard|お絵描き|描画|ペイント|ホワイトボード/, icon: "🎨", category: "デザイン", color: "#ec4899", description: "描画やデザイン制作を支援するツールです。" },
      { pattern: /color[-_ ]?(picker|pick|palette|converter)|palette|色選択|カラーピッカー|配色|カラーコード/, icon: "🌈", category: "デザイン", color: "#ec4899", description: "色の選択や配色を扱うツールです。" },
      { pattern: /svg|vector[-_ ]?editor|logo[-_ ]?maker|icon[-_ ]?maker|ロゴ|アイコン作成|ベクター/, icon: "✒️", category: "デザイン", color: "#a855f7", description: "図形・ロゴ・ベクター画像などの制作ツールです。" },
      { pattern: /gif|animation|animator|アニメーション/, icon: "🎞️", category: "画像・動画", color: "#db2777", description: "アニメーションやGIFを扱うツールです。" },
      { pattern: /screenshot|screen[-_ ]?capture|capture[-_ ]?screen|画面キャプチャ|スクリーンショット|画面保存/, icon: "📸", category: "画面・キャプチャ", color: "#64748b", description: "画面のキャプチャや保存に関するツールです。" },

      // 個別パターンは、広いキーワード（IDE・chart・mapなど）より先に評価する。
      { pattern: /qr[-_ ]?(code|generator)|barcode|qrコード|バーコード/, icon: "🔳", category: "コード・識別", color: "#64748b", description: "QRコードや識別コードを扱うツールです。" },

      { pattern: /slideshow|slide[-_ ]?maker|presentation|powerpoint|スライド|プレゼン|発表資料/, icon: "🖥️", category: "プレゼンテーション", color: "#ea580c", description: "スライドやプレゼンテーション資料に関するツールです。" },
      { pattern: /diagram|flowchart|mind[-_ ]?map|uml|フローチャート|マインドマップ|図解|ダイアグラム/, icon: "🗺️", category: "図解・設計", color: "#0d9488", description: "図解やフロー、構成の可視化に関するツールです。" },
      { pattern: /3d[-_ ]?(viewer|model|editor)|three[-_ ]?js|model[-_ ]?viewer|3d表示|3dモデル/, icon: "🧊", category: "3D・シミュレーション", color: "#0891b2", description: "3Dモデルや立体表示に関するツールです。" },

      // 開発・Web・Git
      { pattern: /github|\bgit(?:[-_ ]?(?:branch|commit|diff|log|merge|tool))?\b|リポジトリ|ブランチ|コミット|バージョン管理/, icon: "🐙", category: "開発・Git", color: "#64748b", description: "Gitやリポジトリ管理を支援するツールです。" },
      { pattern: /html[-_ ]?editor|css[-_ ]?editor|javascript|\bjs[-_ ]?editor\b|code[-_ ]?(editor|playground)|\bide\b|compiler|interpreter|terminal|console|playground|コードエディター|プログラミング|開発環境|コンパイラ|ターミナル/, icon: "💻", category: "開発ツール", color: "#4f46e5", description: "コードの作成・実行・確認を支援する開発ツールです。" },
      { pattern: /json|yaml|toml|xml[-_ ]?editor|formatter|beautifier|minifier|lint|validator|validator|整形|フォーマッター|構文チェック|バリデーター/, icon: "{ }", category: "開発ツール", color: "#6366f1", description: "データ形式やコードの整形・検証に関するツールです。" },

      { pattern: /stopwatch|timer|pomodoro|countdown|clock|alarm|タイマー|ストップウォッチ|ポモドーロ|カウントダウン|時計|アラーム/, icon: "⏱️", category: "時間・計測", color: "#ea580c", description: "時間の計測や管理に関するツールです。" },
      { pattern: /unit[-_ ]?test|test[-_ ]?runner|assertion|テストランナー|単体テスト/, icon: "🧪", category: "開発・テスト", color: "#16a34a", description: "コードや機能のテストを支援するツールです。" },
      { pattern: /log[-_ ]?(viewer|analyzer)|monitor|monitoring|system[-_ ]?info|ログ解析|システム情報|モニター|監視/, icon: "📈", category: "監視・分析", color: "#0891b2", description: "ログやシステム状態の確認・分析に関するツールです。" },

      // 末尾に置く汎用候補（具体的なルールを優先）

    ];

    const GENERIC_FOLDERS = /^(tools?|apps?|programs?|pages?|public|www|html|src|dist|build|assets?)$/i;

    function inferenceText(file) {
      const parts = String(file).split("/");
      return parts.filter((part, index) => index === parts.length - 1 || !GENERIC_FOLDERS.test(part))
        .join(" ").replace(/\.html?$/i, " ").replace(/[()[\]{}.,]/g, " ").toLocaleLowerCase("ja");
    }

    function inferMetadata(file) {
      const text = inferenceText(file);
      return INFERENCE_RULES.find(rule => rule.pattern.test(text)) || null;
    }

    function inferIcon(file) {
      return inferMetadata(file)?.icon || "🧩";
    }

    function inferCategory(file) {
      const inferred = inferMetadata(file);
      if (inferred) return inferred.category;
      const folders = String(file).split("/").slice(0, -1).reverse();
      const meaningfulFolder = folders.find(part => !GENERIC_FOLDERS.test(part));
      return meaningfulFolder || "その他";
    }

    // 表示セクションは最上位フォルダーで自動判定する。
    // 例: tools/example.html -> tools、Archive/example.html -> Archive。
    // JSONの programs[].section が指定されていれば、そちらを優先する。
    function inferSection(file) {
      const parts = String(file).split("/").filter(Boolean);
      return parts.length > 1 ? parts[0] : "その他";
    }

    function inferColor(file) {
      return inferMetadata(file)?.color || defaultColor(file);
    }

    function inferDescription(file) {
      const inferred = inferMetadata(file);
      if (inferred) return inferred.description;
      const folders = String(file).split("/").slice(0, -1).reverse();
      const meaningfulFolder = folders.find(part => !GENERIC_FOLDERS.test(part));
      return meaningfulFolder ? `フォルダー「${meaningfulFolder}」にあるHTMLプログラムです。` : "HTMLプログラムです。表示名や説明はJSONでカスタマイズできます。";
    }

    function inferTitle(file) {
      const filename = filenameOf(String(file));
      const normalized = filename.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
      // index.html / main.html のような一般名は、意味のある親フォルダー名を題名に使う。
      if (/^(index|main|app|home|default)(?:\s*\(\d+\))?$/i.test(normalized)) {
        const folders = String(file).split("/").slice(0, -1).reverse();
        const meaningfulFolder = folders.find(part => !GENERIC_FOLDERS.test(part));
        if (meaningfulFolder) return meaningfulFolder.replace(/[-_]+/g, " ").trim();
      }
      return normalized || "HTMLプログラム";
    }

    // ファイル名をハッシュ化し、未知の用途にも安定した色を割り当てる。
    function defaultColor(seed) {
      const colors = ["#7c5cff", "#1fa6a0", "#e87945", "#d65c94", "#4c8fe8", "#b28a35", "#40a66c", "#9575cd"];
      let hash = 0;
      for (let i = 0; i < String(seed).length; i++) hash = ((hash << 5) - hash + String(seed).charCodeAt(i)) | 0;
      return colors[Math.abs(hash) % colors.length];
    }

    function normalizeProgram(program, position = 0) {
      if (!program || !safeFilePath(program.file) || !/\.html?$/i.test(program.file)) return null;
      const title = String(program.title || inferTitle(program.file));
      return {
        file: program.file,
        title,
        description: String(program.description || inferDescription(program.file)),
        color: safeColor(program.color, inferColor(program.file)),
        textColor: safeColor(program.textColor, "#ffffff"),
        icon: String(program.icon || inferIcon(program.file)).slice(0, 12),
        thumbnail: typeof program.thumbnail === "string" && safeFilePath(program.thumbnail) ? program.thumbnail : "",
        category: String(program.category || inferCategory(program.file) || "その他"),
        section: String(program.section || inferSection(program.file) || "その他"),
        order: Number.isFinite(Number(program.order)) && program.order !== "" ? Number(program.order) : 100000 + position,
        _position: Number.isFinite(Number(program._position)) ? Number(program._position) : position
      };
    }

    function sortPrograms(programs) {
      return programs.slice().sort((a, b) => a.order - b.order || a._position - b._position || a.title.localeCompare(b.title, "ja"));
    }

    // 自動検出リストを基本にし、JSONで指定されたプロパティだけを上書きする。
    // JSONにないファイルも自動検出結果に残す。設定だけに書かれたファイルも末尾に追加する。
    function mergePrograms(discovered, definitions) {
      const customByFile = new Map();
      for (const item of definitions) {
        if (item && safeFilePath(item.file) && /\.html?$/i.test(item.file)) customByFile.set(item.file, item);
      }
      const used = new Set();
      const merged = [];
      for (let i = 0; i < discovered.length; i++) {
        const base = normalizeProgram(discovered[i], i);
        if (!base) continue;
        const custom = customByFile.get(base.file);
        if (custom) {
          const next = { ...base };
          for (const key of ["title", "description", "color", "textColor", "icon", "thumbnail", "category", "section", "order"]) {
            const value = custom[key];
            if (value !== undefined && value !== null && !(typeof value === "string" && value.trim() === "")) next[key] = value;
          }
          merged.push(normalizeProgram(next, i));
          used.add(base.file);
        } else {
          merged.push(base);
        }
      }
      let extraIndex = discovered.length;
      for (const custom of definitions) {
        if (!custom || !safeFilePath(custom.file) || !/\.html?$/i.test(custom.file) || used.has(custom.file) || discovered.some(p => p.file === custom.file)) continue;
        merged.push(normalizeProgram(custom, extraIndex++));
        used.add(custom.file);
      }
      return sortPrograms(merged);
    }

    function loadRecent() {
      try {
        const data = JSON.parse(localStorage.getItem(OPENED_KEY) || "[]");
        return Array.isArray(data) ? data.map(normalizeProgram).filter(Boolean) : [];
      } catch { return []; }
    }

    function rememberOpened(program) {
      try {
        const stored = JSON.parse(localStorage.getItem(OPENED_KEY) || "[]");
        const recent = Array.isArray(stored) ? stored.filter(item => item && item.file !== program.file) : [];
        recent.unshift({
          file: program.file, title: program.title, description: program.description,
          color: program.color, textColor: program.textColor, icon: program.icon,
          thumbnail: program.thumbnail, category: program.category, section: program.section, order: program.order, openedAt: Date.now()
        });
        localStorage.setItem(OPENED_KEY, JSON.stringify(recent.slice(0, MAX_RECENT)));
      } catch { /* ストレージ無効時も起動は継続する */ }
    }

    function programURL(program) {
      return new URL(program.file.split("/").map(encodeURIComponent).join("/"), baseURL).href;
    }

    function makeCard(program) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = programURL(program);
      card.style.setProperty("--card-accent", safeColor(program.color));
      card.style.setProperty("--card-text", safeColor(program.textColor, "#ffffff"));
      card.addEventListener("click", () => rememberOpened(program));

      const thumbnail = document.createElement("div");
      thumbnail.className = "thumbnail";
      if (program.thumbnail) {
        const img = document.createElement("img");
        img.src = new URL(program.thumbnail.split("/").map(encodeURIComponent).join("/"), baseURL).href;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => {
          thumbnail.replaceChildren();
          const emoji = document.createElement("span");
          emoji.className = "emoji";
          emoji.textContent = program.icon;
          thumbnail.append(emoji);
        }, { once: true });
        thumbnail.append(img);
      } else {
        const emoji = document.createElement("span");
        emoji.className = "emoji";
        emoji.textContent = program.icon;
        thumbnail.append(emoji);
      }

      const category = document.createElement("span");
      category.className = "tag";
      category.textContent = program.category;
      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = program.title;
      title.style.color = safeColor(program.textColor, "#ffffff");
      const description = document.createElement("div");
      description.className = "description";
      description.textContent = program.description;
      const path = document.createElement("div");
      path.className = "path";
      path.textContent = program.file;

      const content = document.createElement("div");
      content.className = "card-main";
      content.append(category, title, description, path);
      card.append(thumbnail, content);
      return card;
    }

    function groupBySection(programs) {
      const groups = new Map();
      for (const program of programs) {
        const section = String(program.section || inferSection(program.file) || "その他");
        if (!groups.has(section)) groups.set(section, []);
        groups.get(section).push(program);
      }
      return groups;
    }

    function sectionOrderList() {
      const source = Array.isArray(currentSettings.sectionOrder)
        ? currentSettings.sectionOrder
        : DEFAULT_SECTION_ORDER;
      const cleaned = [];
      const seen = new Set();
      for (const item of source) {
        if (typeof item !== "string" || !item.trim()) continue;
        const value = item.trim();
        const key = value.toLocaleLowerCase("ja");
        if (seen.has(key)) continue;
        seen.add(key);
        cleaned.push(value);
      }
      // sectionOrder を省略した場合や、設定に recent を書き忘れた場合も最近使った項目は先頭。
      if (!seen.has("recent")) cleaned.unshift("recent");
      return cleaned;
    }

    function orderSections(sections) {
      const configured = sectionOrderList();
      const rank = new Map(configured.map((name, index) => [name.toLocaleLowerCase("ja"), index]));
      return sections.sort((a, b) => {
        const aKey = String(a.dataset.sectionKey || "").toLocaleLowerCase("ja");
        const bKey = String(b.dataset.sectionKey || "").toLocaleLowerCase("ja");
        const aRank = rank.has(aKey) ? rank.get(aKey) : Number.MAX_SAFE_INTEGER;
        const bRank = rank.has(bKey) ? rank.get(bKey) : Number.MAX_SAFE_INTEGER;
        if (aRank !== bRank) return aRank - bRank;
        return aKey.localeCompare(bKey, "ja");
      });
    }

    function createSection(key, titleText, countText) {
      const section = document.createElement("section");
      section.className = "list-section folder-section";
      section.dataset.sectionKey = key;
      const heading = document.createElement("div");
      heading.className = "section-heading";
      const title = document.createElement("h2");
      title.textContent = titleText;
      const meta = document.createElement("div");
      meta.className = "heading-meta";
      const count = document.createElement("span");
      count.className = "section-count";
      count.textContent = countText;
      const cue = document.createElement("span");
      cue.className = "scroll-cue";
      cue.setAttribute("aria-hidden", "true");
      cue.textContent = "横にスワイプ →";
      meta.append(count, cue);
      heading.append(title, meta);
      section.append(heading);
      return section;
    }

    function makeRecentSection(query = "") {
      const normalizedQuery = query.trim().toLocaleLowerCase("ja");
      const recent = loadRecent()
        .filter(item => !normalizedQuery || `${item.title} ${item.description} ${item.file} ${item.category}`.toLocaleLowerCase("ja").includes(normalizedQuery))
        .slice(0, 6);
      // 検索中に該当履歴がなければ空の見出しを増やさない。初回表示では見出しと案内を出す。
      if (!recent.length && normalizedQuery) return null;
      const section = createSection("recent", "最近使った項目", `${recent.length}件`);
      if (recent.length) {
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const program of recent) grid.append(makeCard(program));
        section.append(grid);
      } else {
        const empty = document.createElement("div");
        empty.className = "recent-empty";
        empty.textContent = "プログラムを開くと、ここに表示されます。";
        section.append(empty);
      }
      return section;
    }

    function makeProgramSections(programs) {
      const sections = [];
      for (const [sectionName, items] of groupBySection(programs)) {
        const section = createSection(sectionName, sectionName, `${items.length}件`);
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const program of items) grid.append(makeCard(program));
        section.append(grid);
        sections.push(section);
      }
      return sections;
    }

    function render() {
      const query = $("search").value.trim().toLocaleLowerCase("ja");
      const filtered = allPrograms.filter(program => `${program.title} ${program.description} ${program.file} ${program.category} ${program.section}`.toLocaleLowerCase("ja").includes(query));
      $("count").textContent = `${filtered.length} / ${allPrograms.length} 件`;

      const sections = [];
      const recentSection = makeRecentSection($("search").value);
      if (recentSection) sections.push(recentSection);
      sections.push(...makeProgramSections(filtered));

      const host = $("sections");
      host.replaceChildren();
      const ordered = orderSections(sections);
      if (!ordered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = allPrograms.length
          ? "該当するプログラムがありません。検索語を確認してください。"
          : "プログラム一覧を読み込んでいます…";
        host.append(empty);
        return;
      }
      host.append(...ordered);
    }
    $("search").addEventListener("input", render);

    function applySettings(settings = {}, replace = false) {
      if (replace) currentSettings = {};
      currentSettings = { ...currentSettings, ...settings };
      const title = String(currentSettings.title || "プログラムランチャー");
      const subtitle = String(currentSettings.subtitle || "HTMLプログラムを選択してください。初回に開いたページは、次回からオフラインでも表示できるよう保存されます。");
      $("pageTitle").textContent = title;
      document.title = title;
      $("subtitle").textContent = subtitle;
      document.documentElement.classList.toggle("hide-path", currentSettings.showPath === false);
    }

    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function cachedPrograms() {
      try {
        const stored = JSON.parse(localStorage.getItem(cacheKey) || "null");
        if (stored && Array.isArray(stored.programs)) {
          applySettings(stored.settings || {}, true);
          return sortPrograms(stored.programs.map(normalizeProgram).filter(Boolean));
        }
      } catch { /* キャッシュ破損は無視 */ }
      return [];
    }

    async function loadGitHubPrograms() {
      const match = location.hostname.match(/^([^./]+)\.github\.io$/i);
      if (!match) throw new Error("カスタムドメインではGitHubリポジトリを特定できません。program-index.json または保存済み一覧を利用してください。");
      const pathParts = location.pathname.split("/").filter(Boolean);
      const owner = match[1];
      const repo = pathParts.length ? decodeURIComponent(pathParts[0]) : `${owner}.github.io`;
      const repository = await fetchJSON(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`);
      const branch = repository.default_branch;
      const tree = await fetchJSON(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
      if (tree.truncated) throw new Error("リポジトリ内のファイル数が多いため自動一覧を作れません。program-index.json に必要なファイルを設定してください。");
      const files = tree.tree.filter(item => {
        if (item.type !== "blob" || !/\.html?$/i.test(item.path)) return false;
        const lower = item.path.toLowerCase();
        if (lower === "index.html" || lower === "offline.html") return false;
        if (item.path.split("/").some(part => part.startsWith("."))) return false;
        return true;
      });
      const programs = files.map((file, index) => {
        const parts = file.path.split("/");
        const filename = parts.pop().replace(/\.html?$/i, "");
        const folder = parts.join("/");
        return normalizeProgram({
          file: file.path,
          title: inferTitle(file.path),
          description: inferDescription(file.path),
          color: inferColor(file.path), icon: inferIcon(file.path), category: inferCategory(file.path)
        }, index);
      }).filter(Boolean);
      return sortPrograms(programs);
    }

    function saveProgramCache(programs) {
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ settings: currentSettings, programs }));
      } catch { /* ストレージが使えなくても一覧表示は続ける */ }
    }

    function showLoadError(message) {
      $("count").textContent = "読み込み失敗";
      $("sections").replaceChildren();
      const error = document.createElement("div");
      error.className = "error";
      error.textContent = message;
      $("sections").append(error);
    }

    async function init() {
      // 以前に取得した一覧を先に表示し、通信完了を待たせない。
      const previous = cachedPrograms();
      if (previous.length) {
        allPrograms = previous;
        render();
        if (!navigator.onLine) $("footerStatus").textContent = "オフラインのため、保存済みの一覧を表示しています。";
      }

      // 設定JSONとGitHubのHTML一覧を並行取得する。JSONは任意で、なくても自動一覧を作る。
      const configPromise = fetchJSON(INDEX_FILE)
        .then(config => ({ ok: true, config }))
        .catch(error => ({ ok: false, error }));
      const discoveryPromise = navigator.onLine
        ? loadGitHubPrograms().then(programs => ({ ok: true, programs })).catch(error => ({ ok: false, error }))
        : Promise.resolve({ ok: false, error: new Error("オフラインです") });

      const configResult = await configPromise;
      let config = null;
      let definitions = [];
      if (configResult.ok && configResult.config && typeof configResult.config === "object") {
        config = configResult.config;
        applySettings(config.settings || {}, true);
        definitions = Array.isArray(config.programs) ? config.programs : [];
        if (!previous.length && definitions.length) {
          // GitHub APIを待つ間も、JSONの登録項目だけ先に表示できる。
          allPrograms = mergePrograms([], definitions);
          render();
        }
      } else if (navigator.onLine) {
        // JSONが削除・未配置でも、以前の表示設定が残ってしまわないよう初期値へ戻す。
        applySettings({}, true);
      }

      const discoveryResult = await discoveryPromise;
      if (discoveryResult.ok) {
        allPrograms = mergePrograms(discoveryResult.programs, definitions);
        saveProgramCache(allPrograms);
        render();
        if (!discoveryResult.programs.length && !allPrograms.length) {
          $("count").textContent = "0 件";
          $("sections").innerHTML = "<div class=\"empty\">表示できるHTMLプログラムが見つかりませんでした。</div>";
        }
        $("footerStatus").textContent = configResult.ok
          ? "HTMLを自動検出し、program-index.json にある項目だけ表示設定を上書きしています。"
          : "HTMLを自動検出しました。JSONがなくても基本アイコン付きで表示できます。";
        return;
      }

      // 自動検出ができない場合は、保存済み一覧またはJSON登録分を表示する。
      if (previous.length) {
        allPrograms = mergePrograms(previous, definitions);
        saveProgramCache(allPrograms);
        render();
        $("footerStatus").textContent = navigator.onLine
          ? "GitHubから一覧を更新できなかったため、保存済みの一覧を表示しています。"
          : "オフラインのため、保存済みの一覧を表示しています。";
        return;
      }
      if (definitions.length) {
        allPrograms = mergePrograms([], definitions);
        render();
        $("footerStatus").textContent = "GitHubから全HTML一覧を取得できないため、JSONに登録された項目だけを表示しています。";
        return;
      }

      const detail = discoveryResult.error?.message || configResult.error?.message || "原因不明のエラー";
      showLoadError(`${detail}\nオンライン接続を確認してください。初回の一覧取得後は、保存済み一覧をオフラインでも表示できます。program-index.json は任意です。`);
    }

    init();
  </script>
</body>
</html>
