<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101522">
  <meta name="description" content="GitHub Pages上のHTMLプログラムを一覧・起動する軽量ランチャー">
  <title>プログラムランチャー</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #182238;
      --text: #edf2ff;
      --muted: #a5b0c8;
      --line: rgba(188, 204, 238, .13);
      --accent: #7c9cff;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(16px, 4vw, 42px);
      background: radial-gradient(ellipse at top left, #192344 0, transparent 45%), var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1200px, 100%); margin: 0 auto; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    h1 { font-size: clamp(1.65rem, 4vw, 2.4rem); line-height: 1.15; margin: 0; letter-spacing: -.03em; }
    .subtitle { color: var(--muted); margin: 10px 0 0; line-height: 1.65; }
    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-pill, .action-button {
      border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px;
      background: rgba(18, 26, 43, .8); color: var(--muted); font-size: .88rem;
    }
    .status-pill { display: inline-flex; gap: 8px; align-items: center; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #42d6a4; }
    .status-dot.offline { background: #ffbb66; }
    .action-button { color: var(--text); cursor: pointer; }
    .action-button:hover { background: var(--panel-2); }
    .toolbar { display: flex; gap: 12px; margin: 28px 0 26px; }
    .search {
      width: 100%; min-width: 0; padding: 13px 16px; border-radius: 13px;
      border: 1px solid var(--line); outline: none; background: rgba(18, 26, 43, .85);
      color: var(--text); font: inherit;
    }
    .search:focus { border-color: rgba(124, 156, 255, .75); box-shadow: 0 0 0 3px rgba(124, 156, 255, .12); }
    section.list-section { margin-top: 34px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
    h2 { font-size: 1rem; margin: 0; font-weight: 700; color: #dce5ff; }
    .section-count { font-size: .82rem; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 235px), 1fr)); gap: 14px; }
    .category-group + .category-group { margin-top: 27px; }
    .category-title { margin: 0 0 12px; color: var(--muted); font-size: .86rem; font-weight: 650; }
    .card {
      --card-accent: #7c9cff;
      display: flex; min-height: 205px; flex-direction: column; overflow: hidden; position: relative;
      border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
      background: linear-gradient(145deg, color-mix(in srgb, var(--card-accent) 18%, #151d30), #121827 72%);
      color: var(--text); text-decoration: none; isolation: isolate;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--card-accent); }
    .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--card-accent) 68%, white 8%); box-shadow: 0 12px 30px rgba(0,0,0,.18); }
    .card:focus-visible { outline: 3px solid var(--card-accent); outline-offset: 3px; }
    .thumbnail {
      display: grid; place-items: center; width: 100%; height: 82px; margin-bottom: 15px;
      border-radius: 12px; background: color-mix(in srgb, var(--card-accent) 24%, #161d30);
      overflow: hidden; color: var(--card-text, #fff);
    }
    .thumbnail .emoji { font-size: 2.2rem; line-height: 1; }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-title { margin: 0 0 7px; font-size: 1.08rem; font-weight: 750; line-height: 1.35; overflow-wrap: anywhere; }
    .description { color: #bac5dc; font-size: .88rem; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
    .path { color: #8290ad; font-size: .73rem; line-height: 1.4; margin-top: auto; padding-top: 14px; overflow-wrap: anywhere; }
    .tag { display: inline-flex; align-self: flex-start; padding: 4px 8px; margin-bottom: 9px; border-radius: 999px; background: rgba(255,255,255,.08); color: #dfe6f8; font-size: .72rem; }
    .empty, .error { padding: 22px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); line-height: 1.6; }
    .error { border-color: rgba(255, 119, 119, .3); color: #ffabab; }
    footer { border-top: 1px solid var(--line); color: #7e8aa4; margin-top: 44px; padding-top: 18px; font-size: .8rem; line-height: 1.6; }
    [hidden] { display: none !important; }
    .hide-path .path { display: none; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <h1 id="pageTitle">プログラムランチャー</h1>
        <p class="subtitle" id="subtitle">HTMLプログラムを選択してください。初回に開いたページは、次回からオフラインでも表示できるよう保存されます。</p>
      </div>
      <div class="actions">
        <div class="status-pill" role="status" aria-live="polite">
          <span id="networkDot" class="status-dot"></span><span id="networkLabel">接続状態を確認中</span>
        </div>
        <button id="installButton" class="action-button" type="button" hidden>アプリをインストール</button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="題名・説明・ファイル名で検索…" aria-label="プログラムを検索">
    </div>

    <section id="recentSection" class="list-section" hidden>
      <div class="section-heading"><h2>最近開いたプログラム</h2><span id="recentCount" class="section-count"></span></div>
      <div id="recent" class="grid"></div>
    </section>

    <section class="list-section" aria-labelledby="allHeading">
      <div class="section-heading"><h2 id="allHeading">すべてのプログラム</h2><span id="count" class="section-count">読み込み中…</span></div>
      <div id="app" aria-live="polite"><div class="empty">プログラム一覧を読み込んでいます…</div></div>
    </section>

    <footer>
      <span id="footerStatus">一覧のカスタマイズは program-index.json で設定できます。</span>
      <span> · オフライン利用には、GitHub Pages上で一度オンライン起動する必要があります。</span>
    </footer>
  </main>

  <script>
    "use strict";

    const INDEX_FILE = "./program-index.json";
    const OPENED_KEY = "program-launcher-opened-v2";
    const MAX_RECENT = 20;
    const baseURL = new URL("./", location.href);
    const cacheKey = `program-launcher-index-v2:${baseURL.pathname}`;
    let allPrograms = [];
    let installPrompt = null;
    let currentSettings = {};

    const $ = (id) => document.getElementById(id);

    function setNetworkStatus() {
      const online = navigator.onLine;
      $("networkDot").classList.toggle("offline", !online);
      $("networkLabel").textContent = online ? "オンライン" : "オフライン";
    }
    window.addEventListener("online", setNetworkStatus);
    window.addEventListener("offline", setNetworkStatus);
    setNetworkStatus();

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      installPrompt = event;
      $("installButton").hidden = false;
    });
    $("installButton").addEventListener("click", async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice.catch(() => null);
      installPrompt = null;
      $("installButton").hidden = true;
    });

    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
        .then(() => { $("footerStatus").textContent = "オフライン用の保存機能が有効です。設定は program-index.json で変更できます。"; })
        .catch(() => { $("footerStatus").textContent = "オフライン保存の登録に失敗しました。HTTPSのGitHub Pages上で開いてください。"; });
    } else {
      $("footerStatus").textContent = "オフライン保存にはHTTPSのGitHub Pages上で開く必要があります。";
    }

    function safeFilePath(value) {
      if (typeof value !== "string" || !value.trim()) return false;
      if (value.startsWith("/") || value.includes("\\") || /^[a-z]+:/i.test(value)) return false;
      const parts = value.split("/");
      return parts.every(part => part && part !== "." && part !== "..");
    }

    function safeColor(value, fallback = "#7c9cff") {
      if (typeof value !== "string") return fallback;
      const trimmed = value.trim();
      if (window.CSS && CSS.supports("color", trimmed)) return trimmed;
      return fallback;
    }

    function normalizeProgram(program, position = 0) {
      if (!program || !safeFilePath(program.file) || !/\.html?$/i.test(program.file)) return null;
      const filename = program.file.split("/").pop().replace(/\.html?$/i, "");
      return {
        file: program.file,
        title: String(program.title || filename),
        description: String(program.description || "説明はありません"),
        color: safeColor(program.color),
        textColor: safeColor(program.textColor, "#ffffff"),
        icon: String(program.icon || "▣").slice(0, 12),
        thumbnail: typeof program.thumbnail === "string" && safeFilePath(program.thumbnail) ? program.thumbnail : "",
        category: String(program.category || "その他"),
        order: Number.isFinite(Number(program.order)) && program.order !== "" ? Number(program.order) : 100000 + position,
        _position: position
      };
    }

    function sortPrograms(programs) {
      return programs.slice().sort((a, b) => a.order - b.order || a._position - b._position || a.title.localeCompare(b.title, "ja"));
    }

    function loadRecent() {
      try {
        const data = JSON.parse(localStorage.getItem(OPENED_KEY) || "[]");
        return Array.isArray(data) ? data.map(normalizeProgram).filter(Boolean) : [];
      } catch { return []; }
    }

    function rememberOpened(program) {
      try {
        const stored = JSON.parse(localStorage.getItem(OPENED_KEY) || "[]");
        const recent = Array.isArray(stored) ? stored.filter(item => item && item.file !== program.file) : [];
        recent.unshift({
          file: program.file, title: program.title, description: program.description,
          color: program.color, textColor: program.textColor, icon: program.icon,
          thumbnail: program.thumbnail, category: program.category, order: program.order, openedAt: Date.now()
        });
        localStorage.setItem(OPENED_KEY, JSON.stringify(recent.slice(0, MAX_RECENT)));
      } catch { /* ストレージ無効時も起動は継続する */ }
    }

    function programURL(program) {
      return new URL(program.file.split("/").map(encodeURIComponent).join("/"), baseURL).href;
    }

    function makeCard(program) {
      const card = document.createElement("a");
      card.className = "card";
      card.href = programURL(program);
      card.style.setProperty("--card-accent", safeColor(program.color));
      card.style.setProperty("--card-text", safeColor(program.textColor, "#ffffff"));
      card.addEventListener("click", () => rememberOpened(program));

      const thumbnail = document.createElement("div");
      thumbnail.className = "thumbnail";
      if (program.thumbnail) {
        const img = document.createElement("img");
        img.src = new URL(program.thumbnail.split("/").map(encodeURIComponent).join("/"), baseURL).href;
        img.alt = "";
        img.loading = "lazy";
        img.decoding = "async";
        img.addEventListener("error", () => {
          thumbnail.replaceChildren();
          const emoji = document.createElement("span");
          emoji.className = "emoji";
          emoji.textContent = program.icon;
          thumbnail.append(emoji);
        }, { once: true });
        thumbnail.append(img);
      } else {
        const emoji = document.createElement("span");
        emoji.className = "emoji";
        emoji.textContent = program.icon;
        thumbnail.append(emoji);
      }

      const category = document.createElement("span");
      category.className = "tag";
      category.textContent = program.category;
      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = program.title;
      title.style.color = safeColor(program.textColor, "#ffffff");
      const description = document.createElement("div");
      description.className = "description";
      description.textContent = program.description;
      const path = document.createElement("div");
      path.className = "path";
      path.textContent = program.file;

      card.append(thumbnail, category, title, description, path);
      return card;
    }

    function groupByCategory(programs) {
      const groups = new Map();
      for (const program of programs) {
        if (!groups.has(program.category)) groups.set(program.category, []);
        groups.get(program.category).push(program);
      }
      return groups;
    }

    function renderGrouped(container, programs) {
      container.replaceChildren();
      if (!programs.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "該当するプログラムがありません。program-index.json の設定、または検索語を確認してください。";
        container.append(empty);
        return;
      }
      for (const [category, items] of groupByCategory(programs)) {
        const group = document.createElement("div");
        group.className = "category-group";
        const heading = document.createElement("h3");
        heading.className = "category-title";
        heading.textContent = category;
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const program of items) grid.append(makeCard(program));
        group.append(heading, grid);
        container.append(group);
      }
    }

    function renderRecent(query = "") {
      const section = $("recentSection");
      const container = $("recent");
      const normalizedQuery = query.trim().toLocaleLowerCase("ja");
      const recent = loadRecent().filter(item => !normalizedQuery || `${item.title} ${item.description} ${item.file} ${item.category}`.toLocaleLowerCase("ja").includes(normalizedQuery)).slice(0, 6);
      container.replaceChildren();
      section.hidden = recent.length === 0;
      $("recentCount").textContent = recent.length ? `${recent.length}件` : "";
      for (const program of recent) container.append(makeCard(program));
    }

    function render() {
      const query = $("search").value.trim().toLocaleLowerCase("ja");
      const filtered = allPrograms.filter(program => `${program.title} ${program.description} ${program.file} ${program.category}`.toLocaleLowerCase("ja").includes(query));
      $("count").textContent = `${filtered.length} / ${allPrograms.length} 件`;
      renderGrouped($("app"), filtered);
      renderRecent($("search").value);
    }
    $("search").addEventListener("input", render);

    function applySettings(settings = {}) {
      currentSettings = { ...currentSettings, ...settings };
      if (settings.title) {
        $("pageTitle").textContent = String(settings.title);
        document.title = String(settings.title);
      }
      if (settings.subtitle) $("subtitle").textContent = String(settings.subtitle);
      if (settings.showPath === false) document.documentElement.classList.add("hide-path");
    }

    async function fetchJSON(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function cachedPrograms() {
      try {
        const stored = JSON.parse(localStorage.getItem(cacheKey) || "null");
        if (stored && Array.isArray(stored.programs)) {
          applySettings(stored.settings || {});
          return sortPrograms(stored.programs.map(normalizeProgram).filter(Boolean));
        }
      } catch { /* キャッシュ破損は無視 */ }
      return [];
    }

    async function loadGitHubPrograms() {
      const match = location.hostname.match(/^([^./]+)\.github\.io$/i);
      if (!match) throw new Error("program-index.json に一覧を設定してください（カスタムドメインでは自動検索できません）。");
      const pathParts = location.pathname.split("/").filter(Boolean);
      const owner = match[1];
      const repo = pathParts.length ? decodeURIComponent(pathParts[0]) : `${owner}.github.io`;
      const repository = await fetchJSON(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`);
      const branch = repository.default_branch;
      const tree = await fetchJSON(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
      if (tree.truncated) throw new Error("リポジトリのファイル数が多いため自動検索できません。program-index.json に一覧を記入してください。");
      const files = tree.tree.filter(item => item.type === "blob" && /\.html?$/i.test(item.path) && !["index.html", "offline.html"].includes(item.path.toLowerCase()) && !item.path.split("/").some(part => part.startsWith(".")));
      const programs = files.map((file, index) => {
        const parts = file.path.split("/");
        const filename = parts.pop().replace(/\.html?$/i, "");
        const folder = parts.join("/");
        return normalizeProgram({
          file: file.path,
          title: filename.replace(/[-_]+/g, " "),
          description: folder ? `フォルダー: ${folder}` : "説明はありません。program-index.json で編集できます。",
          color: defaultColor(index), icon: "▣", category: folder || "その他", order: index * 10
        }, index);
      }).filter(Boolean);
      return sortPrograms(programs);
    }

    function defaultColor(index) {
      const colors = ["#7c5cff", "#1fa6a0", "#e87945", "#d65c94", "#4c8fe8", "#b28a35", "#40a66c", "#9575cd"];
      return colors[index % colors.length];
    }

    async function init() {
      let usedCachedList = false;
      const previous = cachedPrograms();
      try {
        const config = await fetchJSON(INDEX_FILE);
        applySettings(config.settings || {});
        const configured = Array.isArray(config.programs)
          ? sortPrograms(config.programs.map(normalizeProgram).filter(Boolean))
          : [];
        if (configured.length) {
          allPrograms = configured;
          localStorage.setItem(cacheKey, JSON.stringify({ settings: currentSettings, programs: configured }));
          render();
          return;
        }
        // programs: [] の場合は、GitHub上のHTMLを軽量に自動列挙する。
      } catch (error) {
        if (previous.length) {
          allPrograms = previous;
          usedCachedList = true;
          render();
        }
      }

      if (navigator.onLine) {
        try {
          const discovered = await loadGitHubPrograms();
          if (discovered.length) {
            allPrograms = discovered;
            localStorage.setItem(cacheKey, JSON.stringify({ settings: currentSettings, programs: discovered }));
            render();
            return;
          }
          if (!allPrograms.length) throw new Error("HTMLファイルが見つかりませんでした。");
        } catch (error) {
          if (!allPrograms.length) {
            $("count").textContent = "読み込み失敗";
            $("app").replaceChildren();
            const message = document.createElement("div");
            message.className = "error";
            message.textContent = `${error.message}\n手動で管理する場合は program-index.json の programs にHTMLファイルを追加してください。`;
            $("app").append(message);
            return;
          }
        }
      }

      if (!allPrograms.length && previous.length) {
        allPrograms = previous;
        usedCachedList = true;
      }
      if (allPrograms.length) {
        render();
        if (!navigator.onLine || usedCachedList) $("footerStatus").textContent = "保存済みの一覧を表示中です。ネット接続時に更新できます。";
      } else {
        $("count").textContent = "一覧なし";
        $("app").innerHTML = "<div class=\"empty\">オンラインで一度起動するか、program-index.json にプログラムを設定してください。</div>";
      }
    }

    init();
  </script>
</body>
</html>
